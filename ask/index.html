<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0b">
  <title>Jay White Colorist — Answers</title>
  <meta name="description" content="The answers to the questions you were about to ask.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b0b0b'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' text-anchor='middle' fill='%23ececec'%3EJ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600&display=swap">
  <style>
    @font-face {
      font-family: "Newsreader";
      src: url("../fonts/newsreader.woff2") format("woff2");
      font-weight: 200 800; font-style: normal; font-display: swap;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: #0b0b0b;
      color: #ececec;
      font-family: "Newsreader", Georgia, serif;
      font-size: 18px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    html[lang="ar"] body { font-family: "Noto Naskh Arabic", "Geeza Pro", Tahoma, sans-serif; line-height: 1.7; }
    a { color: inherit; }

    .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 56px; }

    .top { display: flex; justify-content: flex-end; padding-top: max(16px, env(safe-area-inset-top)); }
    .lang {
      font: inherit; font-size: 15px; color: #ececec; background: #1a1a1a;
      border: 1px solid #2c2c2c; border-radius: 999px; padding: 7px 16px; cursor: pointer;
    }
    .lang:hover { border-color: #555; }

    header { padding: 28px 0; }
    h1 { margin: 0; font-size: clamp(32px, 8vw, 44px); font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; }
    html[lang="ar"] h1 { letter-spacing: 0; font-weight: 600; line-height: 1.4; }
    .lead { margin: 12px 0 0; color: #9a9a9a; font-size: 19px; }

    .qa { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .qa li { background: #141414; border: 1px solid #222; border-radius: 16px; padding: 16px 18px; }
    .q { display: block; color: #8a8a8a; font-size: 15px; margin-bottom: 4px; }
    .a { display: block; font-size: 21px; line-height: 1.35; }
    html[lang="ar"] .a { font-size: 20px; line-height: 1.6; }

    .end { margin: 32px 0 0; color: #9a9a9a; }
    .links { display: grid; gap: 10px; margin-top: 14px; }
    .links a {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      text-decoration: none; background: #ececec; color: #0b0b0b;
      border-radius: 14px; padding: 14px 18px; font-size: 18px;
    }
    .links a span:last-child { color: #555; font-size: 15px; direction: ltr; unicode-bidi: isolate; }
    .links a:hover { background: #fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><button class="lang" id="lang" type="button" aria-label="Switch language">العربية</button></div>

    <header>
      <h1 data-t="name">Jay White Colorist</h1>
      <p class="lead" data-t="lead"></p>
    </header>

    <ul class="qa" id="qa"></ul>

    <p class="end" data-t="end"></p>
    <div class="links">
      <a href="https://wa.me/97451849525" rel="noopener"><span data-t="wa">WhatsApp</span><span>+974 5184 9525</span></a>
      <a href="https://instagram.com/jaywhite_colorist" rel="noopener"><span>Instagram</span><span>@jaywhite_colorist</span></a>
      <a href="https://jaycolecolorist.github.io/" rel="noopener"><span data-t="work">My work</span><span>jaycolecolorist.github.io</span></a>
    </div>
  </div>

  <script>
    var T = {
      en: {
        name: "Jay White Colorist",
        lead: "I'm quiet, not rude. Here are the answers to the questions you were about to ask.",
        end: "Anything else? Probably not. If it's about work, message me.",
        wa: "WhatsApp",
        work: "My work",
        switchTo: "العربية",
        qa: [
          ["What's your name?", "Jay White. That's all you need."],
          ["Where are you from?", "Uganda, the Pearl of Africa."],
          ["What do you do?", "I'm a colorist and editor. I grade, edit and make motion graphics for films and ads. I also run my own studio, Adfix."],
          ["How long have you been in Qatar?", "About a year now."],
          ["Why did you come to Qatar?", "Work."],
          ["What languages do you speak?", "English, Luganda, Runyankore, Pidgin and Jamaican Patois."],
          ["Are you Christian?", "Yes, I'm Christian."],
          ["Are you married?", "No. I'm in a relationship."],
          ["Do you have kids?", "No kids."],
          ["How old are you?", "Old enough to do whatever I want."],
          ["How much do you earn?", "I don't discuss that."],
          ["Do you like Arabic food?", "Ugandan food comes first."],
          ["Which football team do you support?", "None. I'm not into football."]
        ]
      },
      ar: {
        name: "جاي وايت — ملوّن أفلام",
        lead: "أنا هادئ، ولست قليل الذوق. هذه أجوبة الأسئلة التي كنت ستسألني إياها.",
        end: "عندك سؤال آخر؟ غالباً لا. إذا كان بخصوص العمل، راسلني.",
        wa: "واتساب",
        work: "أعمالي",
        switchTo: "English",
        qa: [
          ["ما اسمك؟", "جاي وايت. هذا كل ما تحتاج معرفته."],
          ["من أين أنت؟", "من أوغندا، لؤلؤة أفريقيا."],
          ["ما هو عملك؟", "أنا ملوّن أفلام (Colorist) ومونتير. أعمل على تلوين الأفلام والإعلانات ومونتاجها وتصميم الموشن جرافيك. وعندي استوديو خاص بي اسمه Adfix."],
          ["منذ متى وأنت في قطر؟", "حوالي سنة."],
          ["لماذا جئت إلى قطر؟", "للعمل."],
          ["ما اللغات التي تتحدثها؟", "الإنجليزية، واللوغندية، والرونيانكوري، والبيدجن، والباتوا الجامايكية."],
          ["هل أنت مسيحي؟", "نعم، أنا مسيحي."],
          ["هل أنت متزوج؟", "لا، لكني مرتبط."],
          ["هل عندك أطفال؟", "لا، ليس عندي أطفال."],
          ["كم عمرك؟", "كبير بما يكفي لأفعل ما أريد."],
          ["كم راتبك؟", "لا أتحدث عن هذا الموضوع."],
          ["هل تحب الأكل العربي؟", "الأكل الأوغندي أولاً."],
          ["أي فريق كرة قدم تشجّع؟", "ولا فريق. لست من متابعي كرة القدم."]
        ]
      }
    };

    function render(lang) {
      var t = T[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t[el.getAttribute("data-t")]; });
      var list = document.getElementById("qa");
      list.innerHTML = "";
      t.qa.forEach(function (pair) {
        var li = document.createElement("li");
        var q = document.createElement("span"); q.className = "q"; q.textContent = pair[0];
        var a = document.createElement("span"); a.className = "a"; a.textContent = pair[1];
        li.appendChild(q); li.appendChild(a); list.appendChild(li);
      });
      var btn = document.getElementById("lang");
      btn.textContent = t.switchTo;
      btn.lang = lang === "ar" ? "en" : "ar";
      document.title = t.name + (lang === "ar" ? " — أجوبة" : " — Answers");
    }

    var saved = null;
    try { saved = localStorage.getItem("ask-lang"); } catch (e) {}
    var current = (saved === "ar" || saved === "en") ? saved
      : ((navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en");
    render(current);

    document.getElementById("lang").addEventListener("click", function () {
      current = current === "ar" ? "en" : "ar";
      render(current);
      try { localStorage.setItem("ask-lang", current); } catch (e) {}
    });
  </script>
</body>
</html>
